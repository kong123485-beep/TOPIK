ko:"내일 전화할게요。",zh:"明天我會打電話的。",roman:"nae-il jeon-hwa-hal-ge-yo",pron:"[內伊 展話哈給唷]"},{ko:"조금만 기다릴게요。",zh:"我會稍等一下。",roman:"jo-geum-man gi-da-ril-ge-yo",pron:"[組古曼 基搭利給唷]"}],note:"只能主語是我，不能說他會...게요。"},{id:10,cat:"I",form:"V-(으)ㄹ까요?",meaning:"...好嗎？提議/推測",func:"提議一起做或詢問對方意見",conj:"V 母音+ㄹ까요 / 子音+을까요",examples:[{ko:"같이 영화 볼까요?",zh:"一起看電影好嗎？",roman:"ga-chi yeong-hwa bol-kka-yo?",pron:"[嘎七 勇話 波卡唷？]"},{ko:"제가 도와줄까요?",zh:"需要我幫忙嗎？",roman:"je-ga do-wa-jul-kka-yo?",pron:"[接嘎 豆哇租卡唷？]"}],note:"比 ㅂ시다 更柔和、更禮貌的提議。"},{id:11,cat:"I",form:"V/A-고요",meaning:"...而且呢，補充",func:"追加說明，先說一句再補一句",conj:"V/A + 고요",examples:[{ko:"어제 친구를 만났고요, 같이 밥 먹었어요。",zh:"昨天見了朋友呢，還一起吃了飯。",roman:"eo-je chin-gu-reul man-nat-go-yo",pron:"[喔傑 秦古入 曼納估唷]"},{ko:"이거 사고요, 저거도 주세요。",zh:"這個要買呢，那個也請給我。",roman:"i-geo sa-go-yo",pron:"[以勾 沙估唷]"}],note:"口語中整理思緒用，聽力常出現。"},{id:12,cat:"I",form:"V/A-(ㄴ/은)군요",meaning:"原來...啊，恍然大悟",func:"剛得知新資訊的感嘆",conj:"V+는군요 / A母音+군요 / 子音+은군요",examples:[{ko:"비가 오는군요。",zh:"原來在下雨啊。",roman:"bi-ga o-neun-gun-yo",pron:"[比嘎 哦嫩古你唷]"},{ko:"생각보다 비싸군요。",zh:"比想的還貴呢。",roman:"saeng-gak-bo-da bi-ssa-gun-yo",pron:"[生咖波搭 比撒古你唷]"}],note:"說話者之前不知道，現在才知道。"},{id:13,cat:"I",form:"V/A-네요",meaning:"...呢，感嘆發現",func:"直接目睹後的感嘆，語氣比 군요 輕",conj:"V/A + 네요",examples:[{ko:"꽃이 예쁘네요。",zh:"花好漂亮啊。",roman:"kko-chi ye-ppeu-ne-yo",pron:"[勾七 也布內唷]"},{ko:"맛있네요!",zh:"真好吃呢！",roman:"ma-sit-ne-yo",pron:"[媽心內唷]"}],note:"군요偏回憶、네요偏眼前所見。"},{id:14,cat:"II",form:"N-이/가",meaning:"主格助詞",func:"標示主語，強調主體",conj:"N 母音+가 / 子音+이",examples:[{ko:"비가 와요。",zh:"下雨了。",roman:"bi-ga wa-yo",pron:"[比嘎 哇唷]"},{ko:"제가 학생이에요。",zh:"我才是學生。",roman:"je-ga hak-saeng-i-e-yo",pron:"[接嘎 哈生以欸唷]"}],note:"이/가 強調「誰」，은/는 強調對比或主題。",confusion:"은/는 vs 이/가 是TOPIK必考"},{id:15,cat:"II",form:"N-께서",meaning:"主格尊敬",func:"長輩或上司當主語時的尊敬形",conj:"N + 께서 (不分母音子音)",examples:[{ko:"선생님께서 오셨어요。",zh:"老師來了。",roman:"seon-saeng-nim-kke-seo o-syeo-sseo-yo",pron:"[先桑寧給搜 哦秀搜唷]"},{ko:"할머니께서 주셨어요。",zh:"奶奶給的。",roman:"hal-meo-ni-kke-seo ju-syeo-sseo-yo",pron:"[哈媽尼給搜 租秀搜唷]"}],note:"後面動詞也要用 (으)시 尊敬形。"},{id:16,cat:"II",form:"N-(으)로서",meaning:"作為...資格/身份",func:"表示身份、資格",conj:"N 母音+로서 / 子音+으로서",examples:[{ko:"학생으로서 열심히 해야 해요。",zh:"作為學生要努力。",roman:"hak-saeng-eu-ro-seo",pron:"[哈生嗚入搜]"},{ko:"부모로서 걱정돼요。",zh:"作為父母很擔心。",roman:"bu-mo-ro-seo",pron:"[布莫入搜]"}],note:"強調「以...的身份」，和 (으)로 不同。",confusion:"(으)로 是工具，(으)로서 是身份"},{id:17,cat:"II",form:"N-을/를",meaning:"受格助詞",func:"標示動詞的受詞",conj:"N 母音+를 / 子音+을",examples:[{ko:"책을 읽어요。",zh:"讀書。",roman:"chae-geul il-geo-yo",pron:"[拆古 入勾唷]"},{ko:"사과를 먹어요。",zh:"吃蘋果。",roman:"sa-gwa-reul meo-geo-yo",pron:"[沙瓜入 某勾唷]"}],note:"口語常省略，但寫作和TOPIK閱讀一定要認出來。"},{id:18,cat:"II",form:"N-의",meaning:"所有格",func:"的，表示所屬",conj:"N + 의 [에/의]",examples:[{ko:"나의 친구",zh:"我的朋友",roman:"na-ui chin-gu",pron:"[那欸 秦古]"},{ko:"회사의 규칙",zh:"公司的規定",roman:"hoe-sa-ui gyu-chik",pron:"[會沙欸 丟七]"}],note:"發音常念成 에，TOPIK聽力陷阱。"},{id:19,cat:"II",form:"N-하고/와·과/(이)랑",meaning:"和...一起",func:"並列、同伴",conj:"列舉連接",examples:[{ko:"친구하고 영화를 봐요。",zh:"和朋友看電影。",roman:"chin-gu-ha-go",pron:"[秦古哈勾]"},{ko:"사과와 배",zh:"蘋果和梨子",roman:"sa-gwa-wa bae",pron:"[沙瓜哇 杯]"}],note:"하고最口語，와/과最書面，(이)랑最親切。"},{id:20,cat:"II",form:"N-에",meaning:"地點/時間助詞",func:"存在地點、時間點、目的地",conj:"N + 에",examples:[{ko:"집에 있어요。",zh:"在家裡。",roman:"ji-be i-sseo-yo",pron:"[基貝 以搜唷]"},{ko:"3시에 만나요。",zh:"3點見面。",roman:"se-si-e man-na-yo",pron:"[些西欸 曼那唷]"}],note:"靜態存在用 에，動態動作地點用 에서。",confusion:"에 vs 에서 超級必考"},{id:21,cat:"II",form:"N-에서 (場所)",meaning:"在...場所做動作",func:"動作發生的場所",conj:"N + 에서",examples:[{ko:"도서관에서 공부해요。",zh:"在圖書館學習。",roman:"do-seo-gwan-e-seo",pron:"[投搜關欸搜]"},{ko:"식당에서 밥을 먹어요。",zh:"在餐廳吃飯。",roman:"sik-dang-e-seo",pron:"[希當欸搜]"}],note:"有動作→에서，單純存在→에"},{id:22,cat:"II",form:"N-에서 (起點)",meaning:"從...出發",func:"起點、來源",conj:"N + 에서",examples:[{ko:"서울에서 부산까지",zh:"從首爾到釜山",roman:"seo-ul-e-seo bu-san-kka-ji",pron:"[搜烏欸搜 不山嘎基]"},{ko:"학교에서 집까지 걸어가요。",zh:"從學校走回家。",roman:"hak-gyo-e-seo",pron:"[哈給欸搜]"}],note:"時間起點用 부터，地點起點用 에서。"},{id:23,cat:"II",form:"N-에게/한테",meaning:"給...對象",func:"動作的間接受詞",conj:"N + 에게/한테 (口語多用 한테)",examples:[{ko:"친구에게 편지를 써요。",zh:"給朋友寫信。",roman:"chin-gu-e-ge",pron:"[秦古欸給]"},{ko:"동생한테 물어봐요。",zh:"問問弟弟。",roman:"dong-saeng-han-te",pron:"[洞生韓貼]"}],note:"에게書面，한테口語，意思相同。"},{id:24,cat:"II",form:"N-께",meaning:"尊敬給予對象",func:"給長輩的尊敬形",conj:"N + 께",examples:[{ko:"선생님께 드렸어요。",zh:"給老師了。",roman:"seon-saeng-nim-kke",pron:"[先桑寧給]"},{ko:"할아버지께 전화했어요。",zh:"給爺爺打電話了。",roman:"ha-ra-beo-ji-kke",pron:"[哈拉波吉給]"}],note:"對應 께서(主格) / 께(與格) / 께서(奪格)"},{id:25,cat:"II",form:"N-에게서/한테서",meaning:"從...人那裡",func:"從某人處得到",conj:"N + 에게서/한테서",examples:[{ko:"친구에게서 선물을 받았어요。",zh:"從朋友那收到了禮物。",roman:"chin-gu-e-ge-seo",pron:"[秦古欸給搜]"},{ko:"엄마한테서 전화가 왔어요。",zh:"媽媽打電話來了。",roman:"eom-ma-han-te-seo",pron:"[哦媽韓貼搜]"}],note:"從人來用 에게서，從地方來用 에서。"},{id:26,cat:"II",form:"N-(으)로",meaning:"方向/手段/材料",func:"往...、用...、以...為材料",conj:"母音+로 / 子音(ㄹ除外)+으로 / ㄹ+로",examples:[{ko:"오른쪽으로 가세요。",zh:"請往右邊走。",roman:"o-reun-jjo-geu-ro",pron:"[哦輪叩古入]"},{ko:"버스로 가요。",zh:"坐公車去。",roman:"beo-seu-ro ga-yo",pron:"[波搜入 嘎唷]"}],note:"多義助詞，TOPIK閱讀最愛考手段。"},{id:27,cat:"II",form:"N-도",meaning:"也，同樣",func:"追加相同內容",conj:"N + 도 (取代 이/가/을/를)",examples:[{ko:"저도 학생이에요。",zh:"我也是學生。",roman:"jeo-do",pron:"[趙豆]"},{ko:"커피도 주세요。",zh:"咖啡也要。",roman:"keo-pi-do",pron:"[可皮豆]"}],note:"도 會取代主格受格，不能 이도/을도。"},{id:28,cat:"II",form:"N-보다",meaning:"比...更",func:"比較基準",conj:"N + 보다",examples:[{ko:"어제보다 오늘 더워요。",zh:"比昨天今天更熱。",roman:"eo-je-bo-da",pron:"[喔傑波搭]"},{ko:"사과보다 배가 더 비싸요。",zh:"梨子比蘋果更貴。",roman:"sa-gwa-bo-da",pron:"[沙瓜波搭]"}],note:"後面常接 더、제일、덜"},{id:29,cat:"II",form:"N-처럼",meaning:"像...一樣",func:"比喻",conj:"N + 처럼",examples:[{ko:"꽃처럼 예뻐요。",zh:"像花一樣漂亮。",roman:"kkot-cheo-reom",pron:"[勾秋嵐]"},{ko:"아이처럼 울어요。",zh:"像孩子一樣哭。",roman:"a-i-cheo-reom",pron:"[阿以秋嵐]"}],note:"和 같이 意思相近，처럼更強調相似。"},{id:30,cat:"II",form:"N-부터",meaning:"從...開始",func:"時間、範圍的起點",conj:"N + 부터",examples:[{ko:"9시부터 수업이에요。",zh:"從9點開始上課。",roman:"a-hop-si-bu-teo",pron:"[阿霍西布透]"},{ko:"월요일부터 금요일까지",zh:"從週一到週五",roman:"wo-ryo-il-bu-teo",pron:"[沃扭伊布透]"}],note:"從時間用 부터，從地點用 에서。"},{id:31,cat:"II",form:"N-까지",meaning:"到...為止",func:"時間、範圍的終點",conj:"N + 까지",examples:[{ko:"여기까지 오세요。",zh:"請到這裡來。",roman:"yeo-gi-kka-ji",pron:"[由給嘎基]"},{ko:"5시까지 일해요。",zh:"工作到5點。",roman:"da-seot-si-kka-ji",pron:"[搭搜西嘎基]"}],note:"부터~까지 是固定搭配。"},{id:32,cat:"II",form:"N-은/는",meaning:"主題助詞",func:"提出主題、對比",conj:"母音+는 / 子音+은",examples:[{ko:"저는 한국 사람이에요。",zh:"我是韓國人。",roman:"jeo-neun",pron:"[趙嫩]"},{ko:"사과는 맛있어요。",zh:"蘋果的話很好吃。(對比)",roman:"sa-gwa-neun",pron:"[沙瓜嫩]"}],note:"是主題不是主語，TOPIK寫作靈魂。"},{id:33,cat:"II",form:"N-도 (強調)",meaning:"也、甚至",func:"強調包括",conj:"N + 도",examples:[{ko:"물도 없어요。",zh:"連水都沒有。",roman:"mul-do",pron:"[木豆]"},{ko:"한국어도 잘해요。",zh:"韓文也說得很好。",roman:"han-gu-geo-do",pron:"[韓古勾豆]"}],note:"否定句中 도=連...都，肯定句中 도=也"},{id:34,cat:"II",form:"N-만",meaning:"只有、僅僅",func:"限定",conj:"N + 만",examples:[{ko:"나만 알아요。",zh:"只有我知道。",roman:"na-man",pron:"[那曼]"},{ko:"사과만 먹어요。",zh:"只吃蘋果。",roman:"sa-gwa-man",pron:"[沙瓜曼]"}],note:"만 可以和 이/가、을/를 並存？不可以，取代。"},{id:35,cat:"II",form:"N-마다",meaning:"每...",func:"每一個都",conj:"N + 마다",examples:[{ko:"매일마다 운동해요。",zh:"每天都運動。(每天)",roman:"mae-il-ma-da",pron:"[美伊馬搭]"},{ko:"집집마다 달라요。",zh:"每家都不一樣。",roman:"jip-jip-ma-da",pron:"[基普基普馬搭]"}],note:"마다 後面不能用復數，每...都"},{id:36,cat:"II",form:"N-밖에",meaning:"只有...，除...外不",func:"否定句中的只有",conj:"N + 밖에 + 否定",examples:[{ko:"1000원밖에 없어요。",zh:"只有1000元。",roman:"cheon-won-bak-ke",pron:"[千沃巴給]"},{ko:"사과밖에 안 먹어요。",zh:"只吃蘋果(別的不吃)。",roman:"sa-gwa-bak-ke",pron:"[沙瓜巴給]"}],note:"밖에 一定要配 안/못/없다 等否定，否則錯！",confusion:"만 vs 밖에：만肯定否定都可，밖에必否定"},{id:37,cat:"II",form:"N-(이)나",meaning:"大約、或",func:"概數或選擇",conj:"母音+나 / 子音+이나",examples:[{ko:"3시간이나 걸렸어요。",zh:"竟然花了3小時。",roman:"se-si-gan-i-na",pron:"[些西干以那]"},{ko:"커피나 마실래요?",zh:"喝杯咖啡之類的？",roman:"keo-pi-na",pron:"[可皮那]"}],note:"強調數量多或隨便舉例。"},{id:38,cat:"II",form:"N-하고 (同伴)",meaning:"和...一起",func:"同伴格",conj:"N + 하고",examples:[{ko:"친구하고 같이 가요。",zh:"和朋友一起去。",roman:"chin-gu-ha-go",pron:"[秦古哈勾]"},{ko:"가족하고 여행해요。",zh:"和家人旅行。",roman:"ga-jok-ha-go",pron:"[嘎竹果哈勾]"}],note:"하고 最口語，考試也常出現。"},{id:39,cat:"II",form:"N-와/과",meaning:"和... (書面)",func:"正式的和",conj:"母音+와 / 子音+과",examples:[{ko:"사과와 바나나",zh:"蘋果和香蕉",roman:"sa-gwa-wa",pron:"[沙瓜哇]"},{ko:"책과 공책",zh:"書和筆記本",roman:"chaek-gwa",pron:"[拆誇]"}],note:"新聞、論文愛用 와/과"},{id:40,cat:"II",form:"N-(이)랑",meaning:"和... (口語親切)",func:"口語並列",conj:"母音+랑 / 子音+이랑",examples:[{ko:"철수랑 영희",zh:"哲洙和英姬",roman:"cheol-su-rang",pron:"[秋蘇郎]"},{ko:"밥이랑 김치",zh:"飯和泡菜",roman:"ba-bi-rang",pron:"[爸比郎]"}],note:"朋友間常用 (이)랑"},{id:41,cat:"II",form:"N1-(이)나 N2",meaning:"N1或N2",func:"選擇其一",conj:"N1+(이)나 N2",examples:[{ko:"커피나 차 주세요。",zh:"請給咖啡或茶。",roman:"keo-pi-na cha",pron:"[可皮那 掐]"},{ko:"사과나 배나 다 좋아요。",zh:"蘋果或梨子都喜歡。",roman:"sa-gwa-na bae-na",pron:"[沙瓜那 杯那]"}],note:"表示隨便哪個都行。"},{id:42,cat:"III",form:"V/A-고",meaning:"而且、並且",func:"並列連接",conj:"V/A + 고",examples:[{ko:"크고 예뻐요。",zh:"又大又漂亮。",roman:"keu-go ye-ppeo-yo",pron:"[可勾 也波唷]"},{ko:"밥을 먹고 학교에 가요。",zh:"吃了飯去學校。",roman:"ba-beul meok-go",pron:"[巴布 某勾]"}],note:"最基礎的連接，兩個動作/狀態並列。"},{id:43,cat:"III",form:"V-고 (然後)",meaning:"...然後",func:"動作先後順序",conj:"V + 고",examples:[{ko:"씻고 자요。",zh:"洗完再睡。",roman:"ssit-go ja-yo",pron:"[洗勾 架唷]"},{ko:"사과를 사고 집에 갔어요。",zh:"買了蘋果回家了。",roman:"sa-go jip-e",pron:"[沙勾 基貝]"}],note:"強調先後，고 前動作先完成。"},{id:44,cat:"III",form:"V/A-지만",meaning:"但是、雖然",func:"轉折",conj:"V/A + 지만",examples:[{ko:"비싸지만 맛있어요。",zh:"雖然貴但好吃。",roman:"bi-ssa-ji-man",pron:"[比撒基曼]"},{ko:"공부했지만 몰라요。",zh:"學了但還是不懂。",roman:"gong-bu-hae-sseu-ji-man",pron:"[孔布嘿搜基曼]"}],note:"지만 前後主語可以不同。"},{id:45,cat:"III",form:"V/A-아/어서 (原因)",meaning:"因為...所以",func:"原因理由，前句是後句原因",conj:"ㅏㅗ+아서 / 其他+어서 / 하+해서",examples:[{ko:"배가 아파서 못 먹어요。",zh:"因為肚子痛不能吃。",roman:"bae-ga a-pa-seo",pron:"[杯嘎 阿帕搜]"},{ko:"추워서 창문을 닫아요。",zh:"因為冷關窗戶。",roman:"chu-wo-seo",pron:"[秋沃搜]"}],note:"不能用於命令、勸誘句，後句不能用 (으)세요、(으)ㅂ시다",confusion:"아서/어서 vs (으)니까：後者可用於命令"},{id:46,cat:"III",form:"V-아/어서 (順序)",meaning:"...然後",func:"動作先後，前動作完成才有後動作",conj:"同上，但只能接動詞",examples:[{ko:"옷을 입어서 나가요。",zh:"穿了衣服出去。",roman:"o-seul i-beo-seo",pron:"[喔搜 入波搜]"},{ko:"밥을 먹어서 양치해요。",zh:"吃了飯刷牙。",roman:"ba-beul meo-geo-seo",pron:"[巴布 某勾搜]"}],note:"兩個動作緊密相連，時間不間斷。"},{id:47,cat:"III",form:"V/A-(으)니까",meaning:"因為...，所以",func:"原因，後句可用命令、勸誘",conj:"V/A 母音+니까 / 子音+으니까",examples:[{ko:"추우니까 창문을 닫으세요。",zh:"因為冷請關窗。",roman:"chu-u-ni-kka",pron:"[秋烏尼嘎]"},{ko:"시간이 없으니까 빨리 가요。",zh:"因為沒時間快走吧。",roman:"si-ga-ni eop-seu-ni-kka",pron:"[西嘎尼 歐布斯尼嘎]"}],note:"口語中因為的萬能形，可接命令句！",confusion:"아서/어서 不可接命令，(으)니까 可以"},{id:48,cat:"III",form:"V/A-거나",meaning:"或者...或者",func:"選擇其一",conj:"V/A + 거나",examples:[{ko:"영화를 보거나 책을 읽어요。",zh:"看電影或看書。",roman:"yeong-hwa-reul bo-geo-na",pron:"[勇化入 波勾那]"},{ko:"바쁘거나 피곤해요。",zh:"忙或累。",roman:"ba-ppeu-geo-na",pron:"[巴波勾那]"}],note:"或...或，可以接兩個以上。"},{id:49,cat:"III",form:"V/A-는/(으)ㄴ데 (背景)",meaning:"...呢，背景說明",func:"先提供背景再說重點",conj:"V+는데 / A母音+ㄴ데 / 子音+은데 / N+인데",examples:[{ko:"지금 바쁜데 나중에 전화할게요。",zh:"現在忙呢，等一下打給你。",roman:"ji-geum ba-ppeun-de",pron:"[基古 巴奔爹]"},{ko:"비가 오는데 우산이 없어요。",zh:"下雨呢，沒有傘。",roman:"bi-ga o-neun-de",pron:"[比嘎 哦嫩爹]"}],note:"韓國人說話最愛用的鋪墊，聽力高頻。"},{id:50,cat:"III",form:"V/A-는/(으)ㄴ데 (轉折)",meaning:"可是...",func:"輕微轉折，比 지만 柔和",conj:"同上",examples:[{ko:"맛있는데 너무 비싸요。",zh:"好吃但太貴了。",roman:"ma-sit-neun-de",pron:"[媽新嫩爹]"},{ko:"가고 싶은데 시간이 없어요。",zh:"想去但沒時間。",roman:"ga-go si-peun-de",pron:"[嘎勾 西噴爹]"}],note:"背景和轉折其實是同一個文法，語境決定。"},{id:51,cat:"III",form:"V-(으)러",meaning:"為了...而去",func:"去某地為了做某事，後句一定是去/來",conj:"V 母音+러 / 子音+으러",examples:[{ko:"밥을 먹으러 식당에 가요。",zh:"去餐廳吃飯。",roman:"ba-beul meo-geu-reo",pron:"[巴布 某古羅]"},{ko:"책을 사러 서점에 가요。",zh:"去書店買書。",roman:"chae-geul sa-reo",pron:"[拆古 沙羅]"}],note:"後句只能是 가다/오다/다니다 等移動動詞。"},{id:52,cat:"III",form:"V-(으)려고",meaning:"想要...而，打算",func:"意圖",conj:"V 母音+려고 / 子音+으려고",examples:[{ko:"한국에 가려고 공부해요。",zh:"為了去韓國而學習。",roman:"han-gu-ge ga-ryeo-go",pron:"[韓古欸 嘎留勾]"},{ko:"일찍 자려고 해요。",zh:"打算早點睡。",roman:"il-jjik ja-ryeo-go",pron:"[伊即 架留勾]"}],note:"後面常接 하다、하다 的變化形。"},{id:53,cat:"III",form:"V-(으)면서",meaning:"一邊...一邊...",func:"同時進行兩個動作",conj:"V 母音+면서 / 子音+으면서",examples:[{ko:"음악을 들으면서 공부해요。",zh:"一邊聽音樂一邊學習。",roman:"eu-ma-geul deu-reu-myeon-seo",pron:"[吾媽古 都入眠搜]"},{ko:"걸으면서 전화해요。",zh:"一邊走一邊打電話。",roman:"geo-reu-myeon-seo",pron:"[勾入眠搜]"}],note:"兩個動作主語必須相同。"},{id:54,cat:"III",form:"V/A-(으)면",meaning:"如果...",func:"假設條件",conj:"V/A 母音+면 / 子音+으면",examples:[{ko:"시간이 있으면 만나요。",zh:"如果有時間就見面。",roman:"si-ga-ni i-sseu-myeon",pron:"[西嘎尼 以搜眠]"},{ko:"비싸면 안 사요。",zh:"如果貴就不買。",roman:"bi-ssa-myeon",pron:"[比撒眠]"}],note:"假設，不一定發生。"},{id:55,cat:"III",form:"A-게",meaning:"變得...地",func:"形容詞變副詞",conj:"A + 게",examples:[{ko:"맛있게 먹어요。",zh:"好吃地吃。",roman:"ma-sit-ge",pron:"[媽西給]"},{ko:"예쁘게 입어요。",zh:"漂亮地穿。",roman:"ye-ppeu-ge",pron:"[也布給]"}],note:"形容詞+게+動詞，是副詞化。"},{id:56,cat:"IV",form:"V/A-았/었-",meaning:"過去式",func:"表示過去完成",conj:"ㅏㅗ+았 / 其他+었 / 하+했",examples:[{ko:"어제 영화를 봤어요。",zh:"昨天看了電影。",roman:"eo-je yeong-hwa-reul bwa-sseo-yo",pron:"[喔傑 勇化入 哇搜唷]"},{ko:"맛있었어요。",zh:"很好吃（過去）。",roman:"ma-si-sseo-sseo-yo",pron:"[媽西搜搜唷]"}],note:"TOPIK I 核心，過去式。"},{id:57,cat:"IV",form:"V/A-겠-",meaning:"將要、打算、推測",func:"未來或推測",conj:"V/A + 겠",examples:[{ko:"내일 비가 오겠어요。",zh:"明天大概會下雨。",roman:"nae-il bi-ga o-ge-sseo-yo",pron:"[內伊 比嘎 哦給搜唷]"},{ko:"열심히 하겠습니다。",zh:"我會努力的。",roman:"yeol-si-mi ha-get-seum-ni-da",pron:"[由西米 哈給思姆尼搭]"}],note:"正式體 하겠습니다 是面試必用。"},{id:58,cat:"IV",form:"V/A-(으)시-",meaning:"尊敬語",func:"對主語表示尊敬",conj:"母音+시 / 子音+으시 + 어요/습니다",examples:[{ko:"할머니가 주무세요。",zh:"奶奶在睡覺。",roman:"hal-meo-ni-ga ju-mu-se-yo",pron:"[哈媽尼嘎 租木些唷]"},{ko:"선생님이 오셨어요。",zh:"老師來了。",roman:"seon-saeng-ni-mi o-syeo-sseo-yo",pron:"[先桑尼米 哦秀搜唷]"}],note:"主語是長輩時，動詞要加 시"},{id:59,cat:"IV",form:"N-이/가 아니다",meaning:"不是...",func:"否定判斷",conj:"N + 이/가 아니다",examples:[{ko:"저는 학생이 아니에요。",zh:"我不是學生。",roman:"hak-saeng-i a-ni-e-yo",pron:"[哈生以 阿尼欸唷]"},{ko:"이게 사과가 아니에요。",zh:"這個不是蘋果。",roman:"i-ge sa-gwa-ga a-ni-e-yo",pron:"[以給 沙瓜嘎 阿尼欸唷]"}],note:"아니다 也是動詞，要活用。"},{id:60,cat:"IV",form:"안 + V/A",meaning:"不... (短否定)",func:"否定",conj:"안 + V/A",examples:[{ko:"안 먹어요。",zh:"不吃。",roman:"an meo-geo-yo",pron:"[安 某勾唷]"},{ko:"안 비싸요。",zh:"不貴。",roman:"an bi-ssa-yo",pron:"[安 比撒唷]"}],note:"口語最常用否定，簡單直接。",confusion:"안 vs 못：안=主觀不想，못=客觀不能"},{id:61,cat:"IV",form:"못 + V",meaning:"不能... (能力)",func:"否定-不能",conj:"못 + V (不能接形容詞)",examples:[{ko:"못 가요。",zh:"不能去。",roman:"mot ga-yo",pron:"[某 嘎唷]"},{ko:"한국어를 못 해요。",zh:"不會韓文。",roman:"han-gu-geo-reul mot hae-yo",pron:"[韓古勾入 某貼唷]"}],note:"不能接形容詞，不能說 못 예쁘다"},{id:62,cat:"IV",form:"V/A-지 않다",meaning:"不... (長否定)",func:"書面否定",conj:"V/A + 지 않다",examples:[{ko:"먹지 않아요。",zh:"不吃。",roman:"meok-ji a-na-yo",pron:"[某可基 阿那唷]"},{ko:"어렵지 않아요。",zh:"不難。",roman:"eo-ryeop-ji a-na-yo",pron:"[喔略普基 阿那唷]"}],note:"長否定，寫作常用。"},{id:63,cat:"IV",form:"V-지 못하다",meaning:"未能... (長否定不能)",func:"長形式的不能",conj:"V + 지 못하다",examples:[{ko:"가지 못했어요。",zh:"沒能去。",roman:"ga-ji mo-tae-sseo-yo",pron:"[嘎基 某貼搜唷]"},{ko:"먹지 못해요。",zh:"吃不了。",roman:"meok-ji mo-tae-yo",pron:"[某可基 某貼唷]"}],note:"比 못 更正式。"},{id:64,cat:"IV",form:"V-지 말다",meaning:"不要...，禁止",func:"否定命令",conj:"V + 지 말다 → 지 마세요",examples:[{ko:"가지 마세요。",zh:"請不要去。",roman:"ga-ji ma-se-yo",pron:"[嘎基 馬些唷]"},{ko:"걱정하지 마세요。",zh:"請不要擔心。",roman:"geok-jeong-ha-ji ma-se-yo",pron:"[勾可將哈基 馬些唷]"}],note:"只有命令形，不能說 지 말아요 要說 지 마세요"},{id:65,cat:"IV",form:"V-(으)ㄹ",meaning:"將要...的 (未來定語)",func:"未來/推測的定語",conj:"V 母音+ㄹ / 子音+을 + N",examples:[{ko:"먹을 음식",zh:"要吃的食物",roman:"meo-geul eum-sik",pron:"[某古 恩希克]"},{ko:"갈 곳이 없어요。",zh:"沒有要去的地方。",roman:"gal go-si",pron:"[卡 勾西]"}],note:"未來修飾名詞，TOPIK閱讀核心。"},{id:66,cat:"IV",form:"V-는",meaning:"正在...的 (現在定語)",func:"現在進行的定語",conj:"V + 는 + N",examples:[{ko:"읽는 책",zh:"正在讀的書",roman:"ik-neun chaek",pron:"[伊克嫩 拆克]"},{ko:"가는 사람",zh:"正在去的人",roman:"ga-neun sa-ram",pron:"[嘎嫩 沙攘]"}],note:"現在進行中修飾名詞。"},{id:67,cat:"IV",form:"A-(으)ㄴ",meaning:"...的 (過去定語形容詞)",func:"形容詞過去定語",conj:"A 母音+ㄴ / 子音+은 + N",examples:[{ko:"예쁜 꽃",zh:"漂亮的花",roman:"ye-ppeun kkot",pron:"[也奔 勾特]"},{ko:"작은 집",zh:"小的房子",roman:"ja-geun jip",pron:"[架根 基普]"}],note:"形容詞修飾名詞最常見形。"},{id:68,cat:"IV",form:"V-(으)ㄴ",meaning:"...過的 (過去定語動詞)",func:"過去完成定語",conj:"V 母音+ㄴ / 子音+은 + N",examples:[{ko:"먹은 음식",zh:"吃過的食物",roman:"meo-geun eum-sik",pron:"[某根 恩希克]"},{ko:"간 곳",zh:"去過的地方",roman:"gan got",pron:"[干 勾特]"}],note:"過去動作修飾名詞。"},{id:69,cat:"IV",form:"V-고 있다",meaning:"正在...",func:"進行時",conj:"V + 고 있다",examples:[{ko:"밥을 먹고 있어요。",zh:"正在吃飯。",roman:"ba-beul meok-go i-sseo-yo",pron:"[巴布 某勾 以搜唷]"},{ko:"공부하고 있어요。",zh:"正在學習。",roman:"gong-bu-ha-go i-sseo-yo",pron:"[孔布哈勾 以搜唷]"}],note:"進行時，聽力超高頻。"},{id:70,cat:"IV",form:"V-고 싶다",meaning:"想要...",func:"願望",conj:"V + 고 싶다",examples:[{ko:"한국에 가고 싶어요。",zh:"想去韓國。",roman:"han-gu-ge ga-go si-peo-yo",pron:"[韓古欸 嘎勾 西波唷]"},{ko:"물 마시고 싶어요。",zh:"想喝水。",roman:"mul ma-si-go si-peo-yo",pron:"[木 馬西勾 西波唷]"}],note:"主語是自己用 싶다，主語是別人用 싶어하다"},{id:71,cat:"IV",form:"V/A-(으)ㄹ 것이다",meaning:"將會...",func:"未來推測正式",conj:"V/A 母音+ㄹ 것이다 / 子音+을 것이다",examples:[{ko:"내일 비가 올 것이다。",zh:"明天會下雨。",roman:"nae-il bi-ga ol geo-si-da",pron:"[內伊 比嘎 哦 勾西搭]"},{ko:"열심히 할 것이다。",zh:"會努力的。",roman:"yeol-si-mi hal geo-si-da",pron:"[由西米 哈 勾西搭]"}],note:"書面未來，比 겠 更正式。"},{id:72,cat:"IV",form:"V/A-는/(으)ㄹ 것 같다 (現在)",meaning:"好像...",func:"現在推測",conj:"V+는 것 같다 / A+(으)ㄹ 것 같다",examples:[{ko:"비가 오는 것 같아요。",zh:"好像下雨了。",roman:"bi-ga o-neun geot ga-ta-yo",pron:"[比嘎 哦嫩 勾 嘎塔唷]"},{ko:"맛있는 것 같아요。",zh:"好像很好吃。",roman:"ma-sit-neun geot ga-ta-yo",pron:"[媽新嫩 勾 嘎塔唷]"}],note:"推測語氣，非常常用。"},{id:73,cat:"IV",form:"V/A-(으)ㄹ 것 같다 (未來)",meaning:"好像會...",func:"未來推測",conj:"V/A + (으)ㄹ 것 같다",examples:[{ko:"내일 비가 올 것 같아요。",zh:"明天好像會下雨。",roman:"nae-il bi-ga ol geot ga-ta-yo",pron:"[內伊 比嘎 哦 勾 嘎塔唷]"},{ko:"좋을 것 같아요。",zh:"好像會很好。",roman:"jo-eul geot ga-ta-yo",pron:"[糾 勾 嘎塔唷]"}],note:"未來推測，語氣比 (으)ㄹ 것이다 更委婉。"},{id:74,cat:"IV",form:"V-기 전에",meaning:"在...之前",func:"時間先後",conj:"V + 기 전에",examples:[{ko:"자기 전에 양치해요。",zh:"睡覺前刷牙。",roman:"ja-gi jeo-ne",pron:"[架給 遮內]"},{ko:"가기 전에 전화하세요。",zh:"去之前請打電話。",roman:"ga-gi jeo-ne",pron:"[嘎給 遮內]"}],note:"전에 是之前，후에 是之後。"},{id:75,cat:"IV",form:"V-(으)ㄴ 후에",meaning:"在...之後",func:"之後",conj:"V 母音+ㄴ 후에 / 子音+은 후에",examples:[{ko:"밥을 먹은 후에 산책해요。",zh:"吃飯後散步。",roman:"ba-beul meo-geun hu-e",pron:"[巴布 某根 後欸]"},{ko:"공부한 후에 쉴 거예요。",zh:"學習後會休息。",roman:"gong-bu-han hu-e",pron:"[孔布韓 後欸]"}],note:"過去動作之後。"},{id:76,cat:"IV",form:"V/A-(으)ㄹ 때",meaning:"...的時候",func:"時間點",conj:"V/A 母音+ㄹ 때 / 子音+을 때",examples:[{ko:"어릴 때",zh:"小時候",roman:"eo-ril ttae",pron:"[喔里 呆]"},{
