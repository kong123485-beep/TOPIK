:root {
  --surface: #ffffff;
  --page: #f6f5f1;
  --ink: #1a1a1a;
  --muted: #5f6360;
  --line: #e5e1d8;
  --green: #15803d;
  --green-soft: #ecfdf5;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--page);
}

body {
  margin: 0;
  min-width: 0;
  background: var(--page);
  color: var(--ink);
  font-family: "Noto Sans TC", "Noto Sans KR", "PingFang TC", "Microsoft JhengHei", sans-serif;
}

button {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  width: 100%;
  overflow-x: clip;
  padding-top: var(--safe-area-inset-top);
  background: var(--page);
}

.sticky-header {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 20;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

.header-inner {
  max-width: 1060px;
  margin: 0 auto;
  padding: 16px 16px 14px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #0f766e;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .04em;
}

h1 {
  margin: 8px 0 5px;
  font-size: clamp(22px, 6vw, 34px);
  line-height: 1.25;
  letter-spacing: -.02em;
  font-weight: 900;
}

.subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
}

.progress-head {
  margin-top: 14px;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 14px;
}

.progress-label strong {
  font-size: 15px;
}

.progress-track {
  height: 10px;
  margin-top: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: #ece9e2;
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #14b8a6, #2563eb);
  transition: width .35s ease;
}

.task-count {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 12px;
}

main {
  max-width: 1060px;
  margin: 0 auto;
  padding: 18px 16px 34px;
}

.intro > p {
  margin: 0;
  color: #3f3f3a;
  font-size: 15px;
  line-height: 1.7;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 14px 0 20px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.timeline {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.phase-card {
  position: relative;
  overflow: hidden;
  padding: 22px 18px 18px;
  background: var(--surface);
  border: 1px solid #e9e4da;
  border-top: 6px solid var(--phase);
  border-radius: 20px;
  box-shadow: 0 10px 28px rgba(26,26,26,.06);
  transition: background .2s, border-color .2s;
}

.phase-card.is-done {
  background: var(--green-soft);
  border-color: #bbf7d0;
}

.step-number {
  position: absolute;
  right: 14px;
  top: 12px;
  color: #e6e1d6;
  font-size: 48px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: -.08em;
}

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 36px;
}

.month-badge {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  background: var(--phase-soft);
  color: var(--phase);
  font-size: 15px;
  font-weight: 900;
}

.done-pill {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 9px;
  border-radius: 999px;
  background: #dcfce7;
  color: var(--green);
  font-size: 12px;
  font-weight: 800;
}

.phase-card h2 {
  margin: 18px 0 8px;
  font-size: 23px;
  line-height: 1.25;
}

.description {
  margin: 0;
  font-size: 16px;
  line-height: 1.8;
  color: #242421;
}

.description :lang(ko), .description {
  font-family: "Noto Sans TC", "Noto Sans KR", sans-serif;
}

.complete-button {
  width: 100%;
  min-height: 48px;
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 1.5px solid #d8d2c6;
  border-radius: 13px;
  background: #fff;
  color: var(--ink);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.complete-button:active {
  transform: translateY(1px);
}

.complete-button.active {
  border-color: #22c55e;
  background: #16a34a;
  color: white;
}

.checkbox-mark {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 2px solid #b7b0a3;
  border-radius: 6px;
  background: #fff;
}

.complete-button.active .checkbox-mark {
  border-color: white;
  background: white;
  color: #16a34a;
}

.checklist {
  margin-top: 14px;
  border-top: 1px dashed #ddd8cc;
}

.expand-button {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  background: transparent;
  color: var(--phase);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  padding: 0 2px;
}

.expand-button small {
  margin-left: 5px;
  color: var(--muted);
  font-size: 13px;
}

.expand-button svg {
  transition: transform .2s;
}

.expand-button .rotated {
  transform: rotate(180deg);
}

.task-list {
  display: grid;
  gap: 8px;
  padding-bottom: 4px;
}

.task-item {
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 10px;
  border: 1px solid #e8e2d5;
  border-radius: 12px;
  background: #fbfaf7;
  color: var(--ink);
  text-align: left;
  font-size: 15px;
  line-height: 1.45;
  cursor: pointer;
}

.task-item.checked {
  background: #f0fdf4;
  border-color: #bbf7d0;
}

.task-box {
  flex: 0 0 auto;
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 2px solid #aaa396;
  border-radius: 7px;
  background: white;
}

.task-item.checked .task-box {
  border-color: #16a34a;
  background: #16a34a;
  color: white;
}

.task-label {
  flex: 1 1 auto;
}

.task-state {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.task-item.checked .task-state {
  color: var(--green);
}

.tip-box {
  margin-top: 22px;
  padding: 20px 18px;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 2px 10px;
  background: #fffbeb;
  border: 1px solid #f2dfa5;
  border-radius: 18px;
}

.tip-icon {
  font-size: 26px;
}

.tip-box h2 {
  margin: 0 0 6px;
  font-size: 17px;
}

.tip-box p {
  margin: 0;
  font-size: 15px;
  line-height: 1.7;
}

.tip-note {
  margin-top: 8px !important;
  color: var(--muted);
  font-size: 12px !important;
}

.reset-button {
  grid-column: 1 / -1;
  min-height: 44px;
  margin-top: 15px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid #d9c98b;
  border-radius: 11px;
  background: white;
  color: #765f12;
  font-weight: 800;
  cursor: pointer;
}

.status {
  min-height: 22px;
  margin: 16px 2px 0;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

@media (min-width: 768px) {
  .header-inner {
    padding: 22px 28px 18px;
  }

  main {
    padding: 26px 28px 46px;
  }

  .intro > p {
    font-size: 17px;
  }

  .timeline {
    grid-template-columns: 1fr 1fr;
    gap: 22px;
  }

  .phase-card {
    min-height: 410px;
    padding: 26px 24px 22px;
    display: flex;
    flex-direction: column;
  }

  .phase-card h2 {
    font-size: 26px;
  }

  .description {
    font-size: 17px;
  }

  .checklist {
    margin-top: auto;
    padding-top: 4px;
  }

  .tip-box {
    grid-template-columns: 38px 1fr auto;
    align-items: center;
    padding: 22px;
  }

  .reset-button {
    grid-column: auto;
    margin: 0;
    padding: 0 16px;
    white-space: nowrap;
  }
}

@media (max-width: 390px) {
  .header-inner {
    padding-left: 14px;
    padding-right: 14px;
  }

  main {
    padding-left: 14px;
    padding-right: 14px;
  }

  .phase-card {
    padding-left: 16px;
    padding-right: 16px;
  }

  .month-badge {
    font-size: 14px;
  }

  .step-number {
    font-size: 40px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #1d1d1b;
    --page: #111110;
    --ink: #f4f2ec;
    --muted: #bdbab2;
    --line: #35352f;
    --green-soft: #132d20;
  }

  .phase-card, .complete-button, .task-item, .reset-button {
    background: #22221f;
  }

  .complete-button.active, .task-item.checked .task-box {
    background: #16a34a;
  }

  .task-item.checked {
    background: #173422;
  }

  .progress-track {
    background: #35352f;
  }

  .tip-box {
    background: #2b2616;
    border-color: #51471f;
  }

  .step-number {
    color: #35352f;
  }

  .description {
    color: #eceae4;
  }
}
</style>
