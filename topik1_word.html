:root{
  --surface:#ffffff;
  --bg:#f4f7f7;
  --ink:#1A1A1A;
  --muted:#667085;
  --navy:#34495E;
  --navy-dark:#24384c;
  --teal:#0f766e;
  --teal-bg:#e6f5f2;
  --line:#dce5e4;
  --danger:#b42318;
  --danger-bg:#fef0ee;
  --amber:#fff7e6;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg);
  color:var(--ink)
}

body{
  margin:0;
  font-family:"Noto Sans TC","Noto Sans KR",PingFang TC,Microsoft JhengHei,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink)
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top)
}

.sticky-header{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(255,255,255,.98);
  border-bottom:2px solid var(--navy);
  box-shadow:0 6px 22px rgba(16,40,50,.08)
}

.header-inner{
  max-width:1120px;
  margin:auto;
  padding:18px 16px 14px
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--teal);
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em
}

h1{
  font-size:clamp(25px,6.2vw,42px);
  line-height:1.15;
  letter-spacing:-.03em;
  margin:8px 0 5px;
  font-weight:900
}

h1 span{
  color:var(--teal)
}

.subtitle{
  margin:0;
  color:var(--muted);
  font-size:14px
}

.search-row{
  display:flex;
  gap:10px;
  margin-top:18px
}

.search-box{
  height:48px;
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;
  border:1.5px solid #b8c7c5;
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  color:var(--teal)
}

.search-box:focus-within{
  border-color:var(--teal);
  box-shadow:0 0 0 4px var(--teal-bg);
  outline:none
}

.search-box input{
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  font-size:16px;
  color:var(--ink)
}

.clear-btn{
  width:32px;
  height:32px;
  border:0;
  background:#edf2f2;
  border-radius:50%;
  font-size:16px
}

.speak-all{
  min-height:48px;
  border:0;
  border-radius:12px;
  background:var(--navy);
  color:white;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  white-space:nowrap
}

.speak-all.is-active,.speak-btn.is-active{
  background:#b42318
}

.filter-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:13px;
  flex-wrap:wrap
}

.pill{
  min-height:44px;
  border:1.5px solid #cbd5d3;
  background:#fff;
  border-radius:999px;
  padding:0 16px;
  font-weight:800;
  color:#3e4b4a
}

.pill.active{
  background:var(--teal);
  border-color:var(--teal);
  color:white
}

.count{
  margin-left:auto;
  font-size:14px;
  color:#4a5756
}

.count strong{
  font-size:18px;
  color:var(--navy)
}

.status{
  margin:9px 0 0;
  font-size:13px;
  color:#65716f;
  min-height:18px
}

main{
  max-width:1120px;
  margin:auto;
  padding:18px 16px 32px
}

.intro{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  background:var(--teal-bg);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:16px
}

.intro>div{
  display:flex;
  align-items:flex-start;
  gap:10px;
  color:var(--navy);
  line-height:1.5;
  font-size:14px
}

.intro svg{
  flex:0 0 auto;
  margin-top:2px;
  color:var(--teal)
}

.intro span{
  color:#48615e
}

.reset-btn{
  flex:0 0 auto;
  min-height:44px;
  border:0;
  background:white;
  border-radius:10px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:800;
  color:var(--navy)
}

.table-wrap{
  display:none
}

.cards{
  display:flex;
  flex-direction:column;
  gap:14px
}

.verb-card{
  background:white;
  border:1px solid #dce6e5;
  border-radius:18px;
  padding:14px;
  box-shadow:0 3px 12px rgba(20,50,50,.05);
  overflow:hidden
}

.verb-card.open{
  border-color:var(--teal);
  box-shadow:0 6px 20px rgba(15,118,110,.12)
}

.card-top{
  width:100%;
  min-height:54px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  padding:0;
  color:var(--ink)
}

.card-index{
  font-size:12px;
  font-weight:900;
  color:#91a19f;
  letter-spacing:.08em
}

.card-heading{
  flex:1;
  min-width:0
}

.card-zh{
  font-size:22px;
  line-height:1.25;
  font-weight:900;
  overflow-wrap:anywhere
}

.card-kind{
  font-size:12px;
  color:var(--muted);
  margin-top:3px
}

.badge{
  display:inline-flex;
  align-items:center;
  min-height:30px;
  border-radius:999px;
  padding:4px 9px;
  background:var(--danger-bg);
  color:var(--danger);
  font-size:12px;
  font-weight:900;
  white-space:nowrap
}

.chevron{
  color:var(--teal);
  flex:0 0 auto;
  transition:transform .2s
}

.open .card-top .chevron{
  transform:rotate(180deg)
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 22px 1fr;
  align-items:stretch;
  gap:6px;
  margin-top:12px
}

.form-box{
  min-width:0;
  background:#f3f7f6;
  border-radius:13px;
  padding:13px 9px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}

.form-box span{
  font-size:12px;
  color:var(--muted);
  font-weight:800
}

.form-box strong{
  font-family:"Noto Sans KR","Noto Sans TC",sans-serif;
  font-size:30px;
  line-height:1.25;
  overflow-wrap:anywhere
}

.form-box small{
  font-size:11px;
  color:#7d8b89;
  margin-top:3px
}

.spoken-box{
  background:var(--teal-bg);
  color:#0b4f4a
}

.arrow{
  align-self:center;
  text-align:center;
  color:var(--teal);
  font-weight:900
}

.card-actions{
  display:flex;
  gap:9px;
  margin-top:12px
}

.speak-btn,.example-toggle{
  flex:1;
  min-height:48px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:900
}

.speak-btn{
  border:0;
  background:var(--teal);
  color:white
}

.example-toggle{
  border:1.5px solid #b9cbca;
  background:white;
  color:var(--navy)
}

.example-toggle .rotated{
  transform:rotate(180deg)
}

.example{
  margin-top:13px;
  background:var(--amber);
  border-radius:12px;
  padding:13px 14px
}

.example-label{
  font-size:12px;
  font-weight:900;
  color:#875c00
}

.example-ko{
  font-family:"Noto Sans KR",sans-serif;
  font-size:19px;
  font-weight:800;
  line-height:1.5;
  margin:7px 0 2px
}

.example-zh{
  margin:0;
  color:#5f5541;
  font-size:15px
}

.empty-card{
  background:white;
  border:1px dashed #b8c7c5;
  border-radius:16px;
  padding:28px 18px;
  text-align:center
}

.empty-card p{
  font-size:20px;
  font-weight:900;
  margin:0
}

.empty-card span{
  display:block;
  color:var(--muted);
  margin:8px 0 16px
}

.empty-card button{
  min-height:44px;
  border:0;
  border-radius:10px;
  background:var(--navy);
  color:white;
  padding:0 16px;
  font-weight:800
}

.stop-btn{
  position:fixed;
  right:16px;
  bottom:18px;
  z-index:30;
  min-height:48px;
  border:0;
  border-radius:999px;
  background:#b42318;
  color:white;
  padding:0 18px;
  font-weight:900;
  box-shadow:0 8px 24px rgba(0,0,0,.2)
}

.tip-box{
  background:white;
  border:2px solid var(--teal);
  border-radius:18px;
  padding:18px;
  margin-top:20px
}

.tip-title{
  display:flex;
  align-items:center;
  gap:9px
}

.tip-title h2{
  font-size:20px;
  margin:0
}

.rules{
  display:grid;
  grid-template-columns:1fr;
  gap:9px;
  margin:16px 0
}

.rules>div{
  background:#f4f8f7;
  border-radius:12px;
  padding:13px;
  text-align:center
}

.rules strong{
  display:block;
  font-size:22px
}

.rules span{
  display:block;
  color:var(--teal);
  font-weight:900;
  margin:3px 0
}

.rules small{
  color:var(--muted)
}

.tip-box ul{
  margin:0;
  padding-left:20px;
  line-height:1.75;
  font-size:14px
}

.tip-box li{
  margin:3px 0
}

footer{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  padding:24px 8px 8px
}

@media(min-width:768px){
  .header-inner{
    padding:28px 28px 18px
  }

  .title-break{
    display:none
  }

  .search-box{
    max-width:640px
  }

  .cards{
    display:none
  }

  .table-wrap{
    display:block;
    background:white;
    border:1px solid #dce6e5;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(20,50,50,.06)
  }

  table{
    width:100%;
    border-collapse:collapse
  }

  thead th{
    background:var(--navy);
    color:white;
    text-align:left;
    padding:16px 18px;
    font-size:15px
  }

  tbody td{
    padding:15px 18px;
    border-bottom:1px solid #e6eceb;
    font-size:16px
  }

  tbody tr:nth-child(even){
    background:#f9f9f9
  }

  .ko{
    font-family:"Noto Sans KR",sans-serif;
    font-size:22px;
    font-weight:800
  }

  .zh-cell{
    font-weight:900;
    font-size:18px
  }

  .spoken-cell{
    color:var(--teal)
  }

  .dash{
    color:#a5aeb0
  }

  .mini-speak{
    min-height:44px;
    border:1px solid #c8d7d5;
    background:white;
    border-radius:9px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 12px;
    font-weight:800;
    color:var(--navy)
  }

  .empty{
    text-align:center;
    padding:28px
  }

  .table-note{
    margin:0;
    padding:13px 18px;
    color:var(--muted);
    font-size:13px
  }

  .intro{
    padding:16px 20px
  }

  .rules{
    grid-template-columns:repeat(3,1fr)
  }
}

@media(max-width:390px){
  .header-inner{
    padding-left:12px;
    padding-right:12px
  }

  .search-row{
    flex-direction:column
  }

  .speak-all{
    justify-content:center
  }

  .count{
    width:100%;
    margin-left:0
  }

  .intro{
    flex-direction:column;
    align-items:stretch
  }

  .reset-btn{
    justify-content:center
  }

  .form-box strong{
    font-size:27px
  }

  .card-zh{
    font-size:20px
  }

  .card-actions{
    flex-direction:column
  }

  .badge{
    font-size:11px;
    padding:4px 7px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --surface:#17201f;
    --bg:#111818;
    --ink:#edf3f2;
    --muted:#aab8b6;
    --navy:#a4bfc1;
    --navy-dark:#d4e4e4;
    --teal:#5fc6b9;
    --teal-bg:#203734;
    --line:#354745;
    --danger:#ff9c95;
    --danger-bg:#432221;
    --amber:#30291c
  }

  body,.app-shell{
    background:#111818
  }

  .sticky-header{
    background:rgba(20,29,29,.98);
    border-color:#394b4a
  }

  .search-box,.verb-card,.table-wrap,.tip-box,.reset-btn,.pill,.example-toggle,.mini-speak{
    background:#1b2928
  }

  .search-box input{
    background:#1b2928;
    color:white
  }

  .search-box{
    border-color:#415653
  }

  .pill{
    color:#d5e2e1
  }

  .form-box{
    background:#243534
  }

  .spoken-box{
    background:#203734
  }

  .intro{
    background:#203734
  }

  .intro span{
    color:#b7c8c6
  }

  .example{
    background:#30291c
  }

  .example-zh{
    color:#ddd4ba
  }

  tbody tr:nth-child(even){
    background:#202f2e
  }

  tbody td{
    border-color:#30403f
  }

  .rules>div{
    background:#243534
  }

  .rules small{
    color:#aab8b6
  }

  .count,.status{
    color:#aab8b6
  }
}
